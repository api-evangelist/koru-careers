name: Koru Careers
description: 'Koru (joinkoru.com) was a Seattle-based predictive hiring and people-analytics
  SaaS company. Its platform built a per-employer "predictive hiring fingerprint" and
  scored candidates against the Koru7 Impact Skills assessment — Grit, Rigour, Impact,
  Teamwork, Curiosity, Ownership and Polish — via a 20-minute online pre-interview
  that produced a Candidate Fit Score, with the stated goal of increasing quality of
  hire and reducing screening bias. Products were marketed as Koru Hire and Koru Develop.
  The company was acquired by Cappfinity: between February and November 2020 joinkoru.com
  began redirecting to koru.cappfinity.com, where the Koru7 Impact Skills Assessment
  was carried as a Cappfinity product. That subdomain now redirects to cappfinity.com,
  which carries no remaining Koru branding, and the joinkoru.com domain has lapsed
  and currently serves unrelated online-gambling affiliate content. Koru published
  no public developer portal, documentation, or API; this profile is retained as a
  historical record of a defunct company and no live endpoints are catalogued.'
